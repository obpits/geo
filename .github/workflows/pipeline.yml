name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Single source of truth: reads the version from go.mod.
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    # The scans no longer fail this job (continue-on-error), so the agent job can
    # run on exactly the PRs that have findings. Their outcomes are exported here
    # and enforced by security-gate, which docker-build depends on.
    outputs:
      sast_outcome: ${{ steps.sast.outcome }}
      sca_outcome: ${{ steps.sca.outcome }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: SAST scan with Snyk (snyk code test)
        id: sast
        continue-on-error: true
        uses: snyk/actions/golang@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --json-file-output=snyk-code.json

      - name: SCA scan with Snyk (snyk test)
        id: sca
        continue-on-error: true
        uses: snyk/actions/golang@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --json-file-output=snyk-test.json

      # snyk code test writes no --json-file-output file when it finds nothing,
      # so the agent cannot tell a clean scan from one that never ran by the
      # file alone. Record each step's outcome; the agent accepts a missing
      # findings file only when its step outcome is "success".
      - name: Record scan outcomes
        if: always()
        env:
          SCA: ${{ steps.sca.outcome }}
          SAST: ${{ steps.sast.outcome }}
        run: |
          jq -n --arg sca "$SCA" --arg sast "$SAST" '{sca: $sca, sast: $sast}' > scan-status.json
          cat scan-status.json

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snyk-findings
          path: |
            scan-status.json
            snyk-code.json
            snyk-test.json
          if-no-files-found: warn
          retention-days: 14

      - name: Push Snapshot to Snyk Dashboard
        uses: snyk/actions/golang@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor

  # The pass/fail decision the scans used to make inline. Fails closed: a scan
  # that errored (exit 2/3) is treated the same as one that found something.
  security-gate:
    needs: security-scan
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Enforce scan results
        env:
          SAST: ${{ needs.security-scan.outputs.sast_outcome }}
          SCA: ${{ needs.security-scan.outputs.sca_outcome }}
        run: |
          echo "snyk code test: ${SAST}"
          echo "snyk test:      ${SCA}"
          if [ "${SAST}" != "success" ] || [ "${SCA}" != "success" ]; then
            echo "::error::Snyk reported findings or failed to run. See the security-scan job and the snyk-findings artifact."
            exit 1
          fi

  # Reads the findings artifact and works in a scratch worktree of the PR head:
  # upgrades dependencies, verifies (build, test, fixed-version check, Snyk
  # re-scan, at most three times), and writes result.json, comment.md,
  # trace.jsonl and, for a verified fix, patch.diff and pr.md to disk.
  # Read-only token, and no GitHub credential reaches the binary: checkout does
  # not persist one, and no step here passes GITHUB_TOKEN into the environment.
  # The binary hands its tool subprocesses an allowlisted environment, so
  # go test never sees the API key or the Snyk token. Never add write
  # permissions to this job.
  agent-remediate:
    needs: security-scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # The PR head, not the default merge commit, so patch.diff applies to the
      # branch the agent's pull request will target.
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@v1.0.0

      - name: Download findings
        uses: actions/download-artifact@v8
        with:
          name: snyk-findings
          path: findings

      - name: Build agent
        run: go build -o "${RUNNER_TEMP}/remediate" ./cmd/remediate

      - name: Remediate findings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          "${RUNNER_TEMP}/remediate" \
            -findings findings \
            -out agent-out \
            -repo . \
            -snyk snyk \
            -timeout 15m \
            -max-tokens 16000 \
            -token-budget 400000 \
            -max-turns 20 \
            -run-url "${RUN_URL}"

      - name: Upload triage and trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-triage
          path: agent-out/
          if-no-files-found: warn
          retention-days: 30

  # Publishes the agent's output. Contains no model call, and runs nothing from
  # the repository: it applies a validated diff with git and calls the GitHub
  # API. The only write permissions in the agent path live here.
  #
  # The branch name is built from the PR number and head SHA, and the base is
  # the PR's own head branch, never main; neither comes from the model. Fork
  # PRs get the comment only, since this token cannot push to a fork.
  agent-publish:
    needs: agent-remediate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download agent output
        uses: actions/download-artifact@v8
        with:
          name: agent-triage
          path: agent-out

      - name: Read status
        id: agent
        run: |
          status="$(jq -r .status agent-out/result.json)"
          echo "Agent status: ${status}"
          echo "status=${status}" >> "$GITHUB_OUTPUT"

      - name: Check out PR head
        if: steps.agent.outputs.status == 'patched' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: repo

      - name: Validate patch and open pull request
        id: pr
        if: steps.agent.outputs.status == 'patched' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Branch names are user-controlled text: only ever used via env, never
          # interpolated into the script.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/agent-out"
          patch="${out}/patch.diff"
          body="${out}/pr.md"
          marker='<!-- geo-remediation-agent -->'
          [ -s "${patch}" ] || { echo "::error::patch.diff missing or empty"; exit 1; }
          [ -f "${body}" ] || { echo "::error::pr.md missing"; exit 1; }
          [ "$(head -n1 "${body}")" = "${marker}" ] || { echo "::error::pr.md lacks marker"; exit 1; }
          [ "$(wc -c < "${body}")" -le 60000 ] || { echo "::error::pr.md too large"; exit 1; }

          cd repo
          # Independent of the agent's own check: the patch may touch go.mod
          # and go.sum only. numstat's third column is the path; renames show
          # as "a => b" and fail the match.
          paths="$(git apply --numstat "${patch}" | cut -f3)"
          [ -n "${paths}" ] || { echo "::error::patch touches no files"; exit 1; }
          bad="$(printf '%s\n' "${paths}" | grep -vxE 'go\.mod|go\.sum' || true)"
          [ -z "${bad}" ] || { echo "::error::patch touches disallowed paths: ${bad}"; exit 1; }
          git apply --check "${patch}"
          git apply "${patch}"

          branch="agent/remediate-pr${PR}-${HEAD_SHA:0:7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "${branch}"
          git add go.mod go.sum
          git commit -q -m "Upgrade dependencies to fix security findings in #${PR}"
          # Same branch name for a re-run on the same commit; it is the agent's
          # own branch, so overwriting it is safe.
          git push --force origin "HEAD:refs/heads/${branch}"

          url="$(gh pr list --repo "${REPO}" --head "${branch}" --state open --json url --jq '.[0].url // empty')"
          if [ -n "${url}" ]; then
            gh pr edit "${url}" --body-file "${body}" > /dev/null
            echo "Updated ${url}"
          else
            url="$(gh pr create --repo "${REPO}" --base "${HEAD_REF}" --head "${branch}" \
              --title "Security: dependency upgrade for #${PR}" --body-file "${body}")"
            echo "Opened ${url}"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Validate and post comment
        if: contains(fromJSON('["patched","unfixable","triaged"]'), steps.agent.outputs.status)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          STATUS: ${{ steps.agent.outputs.status }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          marker='<!-- geo-remediation-agent -->'
          body=agent-out/comment.md
          [ -f "${body}" ] || { echo "::error::comment.md missing"; exit 1; }
          [ "$(head -n1 "${body}")" = "${marker}" ] || { echo "::error::comment.md lacks marker"; exit 1; }
          size="$(wc -c < "${body}")"
          [ "${size}" -le 60000 ] || { echo "::error::comment.md is ${size} bytes"; exit 1; }

          if [ "${STATUS}" = "patched" ]; then
            if [ -n "${PR_URL}" ]; then
              printf '\n**Pull request:** %s\n' "${PR_URL}" >> "${body}"
            else
              printf '\n**Pull request not opened:** this workflow cannot push to a fork. The verified patch is in the agent-triage artifact.\n' >> "${body}"
            fi
          fi

          # Update this agent's previous comment instead of adding a new one per push.
          existing="$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" \
            | tail -n1)"
          if [ -n "${existing}" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" -F "body=@${body}" > /dev/null
            echo "Updated comment ${existing}"
          else
            gh pr comment "${PR}" --repo "${REPO}" --body-file "${body}"
          fi

  docker-build:
    needs: [test, security-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GAR_LOCATION: ${{ vars.GAR_LOCATION }}
      GAR_PROJECT: ${{ vars.GAR_PROJECT }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
    outputs:
      image: ${{ steps.image.outputs.name }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image name
        id: image
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          echo "name=${GAR_LOCATION}-docker.pkg.dev/${GAR_PROJECT}/${GAR_REPOSITORY}/$(echo "$repo" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
     
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=,format=short

      - name: Set version
        id: version
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
                    
      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Log in to Google Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'  
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.sha }}

  deploy:
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    env:
      GAR_PROJECT: ${{ vars.GAR_PROJECT }}
      RUN_REGION: ${{ vars.RUN_REGION }}
      RUN_SERVICE: ${{ vars.RUN_SERVICE }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.RUN_SERVICE }}
          region: ${{ env.RUN_REGION }}
          project_id: ${{ env.GAR_PROJECT }}
          # Same short-SHA tag that docker-build just pushed, so Cloud Run
          # runs exactly the image that was built and versioned in this run.
          image: ${{ needs.docker-build.outputs.image }}:${{ needs.docker-build.outputs.sha }}

  verify-deployment:
    needs: [docker-build, deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify deployed version matches build
        env:
          EXPECTED_VERSION: ${{ needs.docker-build.outputs.sha }}
          SERVICE_URL: ${{ needs.deploy.outputs.url }}
        run: |
          set -euo pipefail

          actual_version="$(curl -sf --retry 5 --retry-delay 3 --retry-connrefused \
            "${SERVICE_URL}/version" | jq -r .version)"

          echo "expected: ${EXPECTED_VERSION}"
          echo "actual:   ${actual_version}"

          if [ "${actual_version}" != "${EXPECTED_VERSION}" ]; then
            echo "::error::Deployed version (${actual_version}) does not match built version (${EXPECTED_VERSION})"
            exit 1
          fi
