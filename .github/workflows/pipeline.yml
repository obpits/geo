name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Single source of truth: reads the version from go.mod.
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Scan with Snyk
        uses: snyk/actions/golang@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
      
      - name: Push Snapshot to Snyk Dashboard
        uses: snyk/actions/golang@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor

  docker-build:
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GAR_LOCATION: ${{ vars.GAR_LOCATION }}
      GAR_PROJECT: ${{ vars.GAR_PROJECT }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
    outputs:
      image: ${{ steps.image.outputs.name }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image name
        id: image
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          echo "name=${GAR_LOCATION}-docker.pkg.dev/${GAR_PROJECT}/${GAR_REPOSITORY}/$(echo "$repo" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
     
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=,format=short

      - name: Set version
        id: version
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
                    
      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Log in to Google Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'  
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.sha }}

  deploy:
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    env:
      GAR_PROJECT: ${{ vars.GAR_PROJECT }}
      RUN_REGION: ${{ vars.RUN_REGION }}
      RUN_SERVICE: ${{ vars.RUN_SERVICE }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.RUN_SERVICE }}
          region: ${{ env.RUN_REGION }}
          project_id: ${{ env.GAR_PROJECT }}
          # Same short-SHA tag that docker-build just pushed, so Cloud Run
          # runs exactly the image that was built and versioned in this run.
          image: ${{ needs.docker-build.outputs.image }}:${{ needs.docker-build.outputs.sha }}

  verify-deployment:
    needs: [docker-build, deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify deployed version matches build
        env:
          EXPECTED_VERSION: ${{ needs.docker-build.outputs.sha }}
          SERVICE_URL: ${{ needs.deploy.outputs.url }}
        run: |
          set -euo pipefail

          actual_version="$(curl -sf --retry 5 --retry-delay 3 --retry-connrefused \
            "${SERVICE_URL}/version" | jq -r .version)"

          echo "expected: ${EXPECTED_VERSION}"
          echo "actual:   ${actual_version}"

          if [ "${actual_version}" != "${EXPECTED_VERSION}" ]; then
            echo "::error::Deployed version (${actual_version}) does not match built version (${EXPECTED_VERSION})"
            exit 1
          fi
